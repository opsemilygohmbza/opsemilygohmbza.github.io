name: Deploy public game catalog

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [catalog-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: public-catalog-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate portal configuration
        run: |
          node scripts/validate-portal.mjs
          node --test scripts/test-portal.mjs
      - name: Build reachable game catalog
        run: node scripts/build-catalog.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
